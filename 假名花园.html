<script>(function(root){
  'use strict';
  const normalize=s=>s.trim().toLowerCase().replace(/[’‘]/g,"'");
  const key=(entry,script)=>`${script}:${entry.id}`;
  function fresh(){return {version:1,cards:{},daily:{},answers:0,correct:0,dialogue:{learned:[],records:{}}};}

  function valid(state){return state&&state.version===1&&state.cards&&typeof state.cards==='object'&&!Array.isArray(state.cards)&&state.daily&&typeof state.daily==='object'&&!Array.isArray(state.daily)&&Number.isSafeInteger(state.answers)&&state.answers>=0&&Number.isSafeInteger(state.correct)&&state.correct>=0&&state.correct<=state.answers&&Object.values(state.daily).every(v=>Number.isSafeInteger(v)&&v>=0)&&Object.values(state.cards).every(c=>c&&Number.isSafeInteger(c.streak)&&c.streak>=0&&Number.isSafeInteger(c.wrong)&&c.wrong>=0&&typeof c.review==='boolean'&&typeof c.due==='number'&&Number.isFinite(c.due)&&c.due>=0)&&(state.dialogue===undefined||validDialogue(state.dialogue));}
  function dateKey(date=new Date()){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}
  function record(state,cardKey,success,quiz=true,now=new Date()){
    const c=state.cards[cardKey]||{streak:0,wrong:0,review:false,due:0};
    c.streak=success?Math.min(c.streak+1,20):0;
    if(!success){c.wrong++;c.review=true;}
    if(success&&c.streak>=3)c.review=false;
    c.due=success?now.getTime()+[0,1,3,7,14,30][Math.min(c.streak,5)]*86400000:now.getTime();

    return c;
  }
  function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function choices(current,pool,mode,script){

    const target=label(current);const eligible=mode==='reverse'||mode==='listen'?pool.filter(e=>!e.accepted.some(a=>current.accepted.includes(a))):pool;

  }

  root.KanaLearning=api;if(typeof module!=='undefined')module.exports=api;

</script>

  function lineCard(line){const tokens=D.tokenize(line.kana),familiar=progress().learned.includes(line.id),group=D.groups[line.group];return `<section class="dialogue-detail panel"><div class="dialogue-card-top"><span class="source-label">${group.icon} ${group.name}</span><span>SCENE ${String(D.lines.indexOf(line)+1).padStart(2,'0')}</span></div><div class="scene-caption">${I('spark')}<span>${line.scene}</span></div><div class="dialogue-quote" lang="ja">${line.text}</div><div class="dialogue-translation">${line.meaning}</div><div class="dialogue-reading ${ui.showReading?'':'concealed'}" ${ui.showReading?'':'aria-hidden="true"'}><span lang="ja">${line.kana}</span><small>${line.romaji}</small></div><div class="dialogue-listen"><button class="button" data-action="dialogue-speak" data-id="${line.id}">${I('sound')}听整句</button><button class="button secondary" data-action="dialogue-mark" data-id="${line.id}" aria-pressed="${familiar}">${I(familiar?'check':'leaf')}${familiar?'已标熟悉':'这句我记住了'}</button><label class="switch-label"><input id="dialogue-reading" type="checkbox" ${ui.showReading?'checked':''}>显示读音</label></div><div class="dialogue-divider"></div><div class="dialogue-section-title"><h2>拆开看，每一拍都认识。</h2><span>点假名，听读音 / 看提示</span></div><div class="mora-strip" aria-label="台词假名拆解">${tokens.map((t,i)=>{const info=tokenInfo(line,t,i);return `<button class="mora ${t===line.focus?'focus-mora':''}" data-action="dialogue-token" data-id="${line.id}" data-index="${i}" aria-label="${t}，${info.roman}"><strong lang="ja">${t}</strong><small>${esc(info.roman)}</small></button>`;}).join('')}</div><div id="mora-explanation" class="mora-explanation" role="status" aria-live="polite">${I('info')}<span>${line.note}</span></div><div class="dialogue-notes"><div><span>本句小知识</span><strong>${line.topic}</strong><p>${line.note}</p></div><div><span>什么时候说</span><strong>把语气也一起学会</strong><p>${line.usage}</p></div></div></section>`;}
  function practicePanel(){const n=pool().length;return `<section class="panel dialogue-practice"><div><div class="eyebrow">YOUR TURN</div><h2>轮到你接台词了。</h2><p>当前范围 ${n} 句，每轮最多 10 题。答错的台词会收进「待复习」。</p></div><div class="dialogue-practice-actions"><label for="dialogue-mode" class="sr-only">台词小测方式</label><select id="dialogue-mode">${[['meaning','看台词选意思'],['blank','补全缺失假名'],['listening','听台词选意思']].map(([id,label])=>`<option value="${id}" ${ui.mode===id?'selected':''}>${label}</option>`).join('')}</select><button class="button" data-action="dialogue-start" ${n?'':'disabled'}>来一轮小测 ${I('arrow')}</button></div></section>`;}
  function library(){const list=pool(),p=progress(),s=stats();if(!list.some(l=>l.id===ui.selected)&&list.length)ui.selected=list[0].id;const selected=find(ui.selected);return `${intro()}<div class="dialogue-summary"><span><strong>${D.lines.length}</strong> 句常用表达</span><span><strong>${s.learned}</strong> 句已标熟悉</span><span><strong>${s.review}</strong> 句待复习</span><span>台词小测正确率 <strong>${s.attempts?Math.round(s.correct/s.attempts*100)+'%':'—'}</strong></span></div>${controls()}${list.length?`<div class="dialogue-layout"><aside class="dialogue-library panel"><div class="dialogue-library-heading">今日的台词本 <small>${list.length} SCENES</small></div><div class="dialogue-line-list">${list.map(l=>`<button class="dialogue-line ${l.id===ui.selected?'active':''}" aria-pressed="${l.id===ui.selected}" data-action="dialogue-select" data-id="${l.id}"><span lang="ja">${l.text}</span><small>${l.meaning}</small>${p.learned.includes(l.id)?'<span class="line-status" aria-label="已熟悉">✓</span>':p.records[l.id]?.review?'<span class="line-status review-status" aria-label="待复习">↻</span>':''}</button>`).join('')}</div></aside>${lineCard(selected)}</div>`:`<section class="panel empty-state"><div class="big" lang="ja">言</div><h2>${ui.filter==='review'?'这些台词暂时没有错题。':'还没有符合筛选条件的台词。'}</h2><p>先挑一句听一听，或者把筛选切回「全部」。</p><button class="button secondary" data-action="dialogue-all">查看全部台词</button></section>`}${practicePanel()}<p class="dialogue-footnote">${I('info')} 台词采用通用日语表达与原创情境，不对应特定作品片段。朗读使用设备日语合成语音；台词小测单独统计，记录包含在学习备份中。</p>`;}
  function prepare(){const c=quiz.queue[quiz.index];quiz.answered=false;quiz.choice='';quiz.explanation='';if(quiz.mode==='blank'){const tokens=D.tokenize(c.kana);quiz.blank=Math.max(0,tokens.indexOf(c.focus));quiz.answer=tokens[quiz.blank];const candidates=[...new Set(KanaData.entries.filter(e=>e.group==='basic').map(e=>e.hira))].filter(t=>t!==quiz.answer);quiz.options=L.shuffle([quiz.answer,...L.shuffle(candidates).slice(0,3)]);}else{quiz.answer=c.meaning;quiz.options=L.shuffle([quiz.answer,...L.shuffle(D.lines.filter(l=>l.meaning!==c.meaning)).slice(0,3).map(l=>l.meaning)]);}}
  function start(custom){if(ui.mode==='listening'&&!hasJapaneseVoice()){toast('听台词练习需要设备提供日语语音，请安装日语语音包后重试。');return;}const selected=custom||pool();if(!selected.length)return;quiz={queue:L.shuffle(selected).slice(0,10),index:0,mode:ui.mode,results:[],done:false};prepare();render();}
  function quizView(){if(quiz.done)return result();const q=quiz,c=q.queue[q.index];return `${intro()}<div class="session-wrap dialogue-quiz"><div class="session-top"><span>${D.groups[c.group].name} · 台词小测</span><span>${q.index+1} / ${q.queue.length}</span><button class="button ghost small" data-action="dialogue-exit">返回台词本 ×</button></div><div class="session-progress"><span style="width:${q.index/q.queue.length*100}%"></span></div><section class="panel question-panel"><div class="question-tag">${q.mode==='blank'?'COMPLETE THE LINE':q.mode==='listening'?'LISTEN TO THE LINE':'WHAT DOES IT MEAN?'}</div><p class="dialogue-quiz-scene">${c.scene}</p>${q.mode==='listening'?`<button class="play-large" data-action="dialogue-speak" data-id="${c.id}" aria-label="播放本题台词">${I('sound')}</button><p class="question-instruction">听一听，选择这句台词的意思。</p>`:q.mode==='blank'?`<div class="cloze-line" lang="ja">${D.tokenize(c.kana).map((t,i)=>i===q.blank?`<span class="blank-token ${q.answered?'filled':''}">${q.answered?q.answer:'？'}</span>`:`<span>${t}</span>`).join('')}</div><p class="question-instruction">${c.meaning} · 补上缺失的假名</p>`:`<div class="dialogue-quiz-text" lang="ja">${c.text}</div><p class="question-instruction">选择这句台词的意思。</p>`}<div class="answer-options">${q.options.map((o,i)=>`<button class="answer-option dialogue-answer ${q.mode==='blank'?'kana-option':''} ${q.answered?o===q.answer?'correct':o===q.choice?'wrong':'':''}" data-action="dialogue-answer" data-value="${esc(o)}" ${q.answered?'disabled':''}>${o}<small>${i+1}</small></button>`).join('')}</div><div class="feedback ${q.answered?q.results.at(-1).correct?'good':'bad':''}" aria-live="polite" role="status">${q.answered?q.explanation:'仔细想一想，或按 1–4 选择。'}</div>${q.answered?`<div class="dialogue-answer-note"><strong lang="ja">${c.text}</strong><span>${c.kana} · ${c.romaji}</span><p>${c.note}</p></div><div class="next-row"><button class="button" data-action="dialogue-next">${q.index===q.queue.length-1?'查看结果':'下一句'} ${I('arrow')}</button><button class="button ghost" data-action="dialogue-speak" data-id="${c.id}">${I('sound')}再听一遍</button></div>`:''}</section></div>`;}
  function result(){const correct=quiz.results.filter(r=>r.correct).length,wrong=quiz.results.filter(r=>!r.correct);return `${intro()}<div class="session-wrap"><section class="panel question-panel"><div class="eyebrow">A NEW LINE, A LITTLE CONFIDENCE</div><h2>这段小故事，你听懂了多少？</h2><div class="result-figure">${Math.round(correct/quiz.queue.length*100)}<small>%</small></div><p class="muted">${correct} / ${quiz.queue.length} 题答对 · 台词小测单独统计</p><div class="button-row" style="justify-content:center">${wrong.length?'<button class="button" data-action="dialogue-retry">重练本轮错题</button>':''}<button class="button secondary" data-action="dialogue-exit">回到台词本</button></div>${wrong.length?`<div class="result-list"><div class="muted">这几句，值得再听一次</div>${wrong.map(r=>`<div class="dialogue-result-row"><strong lang="ja">${r.line.text}</strong><span>${r.line.meaning}</span><button class="sound-button" data-action="dialogue-speak" data-id="${r.line.id}" aria-label="播放 ${r.line.text}">${I('sound')}</button></div>`).join('')}</div>`:'<p class="muted" style="margin-top:25px">全对啦。试试换个场景，或者补全假名。</p>'}</section></div>`;}
  function answer(value){if(!quiz||quiz.done||quiz.answered||!quiz.options.includes(value))return;const c=quiz.queue[quiz.index],correct=value===quiz.answer;quiz.answered=true;quiz.choice=value;quiz.results.push({line:c,correct});quiz.explanation=correct?'答对了，这句台词接住啦！':`再记一遍：${quiz.answer}。已加入台词「待复习」。`;const p=progress(),r=p.records[c.id]||{attempts:0,correct:0,review:false};r.attempts++;if(correct)r.correct++;r.review=!correct;p.records[c.id]=r;const state=getState(),day=L.dateKey();state.daily[day]=(state.daily[day]||0)+1;save();render();}
  function handle(action,b){
   if(!action.startsWith('dialogue-'))return false;
   if(action==='dialogue-select'){ui.selected=b.dataset.id;render();}
   else if(action==='dialogue-group'){ui.group=b.dataset.group;render();}
   else if(action==='dialogue-all'){ui.group='all';ui.filter='all';render();}
   else if(action==='dialogue-speak'){const c=find(b.dataset.id);if(c)speak(c.kana);}
   else if(action==='dialogue-token'){const c=find(b.dataset.id),index=Number(b.dataset.index);if(c){const token=D.tokenize(c.kana)[index],info=tokenInfo(c,token,index);const box=document.querySelector('#mora-explanation');if(box)box.innerHTML=I('info')+`<span>${info.detail}</span>`;document.querySelectorAll('.mora').forEach(el=>el.classList.toggle('playing',el===b));if(token!=='っ')speak(D.spokenToken(c,index));}}
   else if(action==='dialogue-mark'){const id=b.dataset.id,p=progress();if(find(id)){p.learned=p.learned.includes(id)?p.learned.filter(k=>k!==id):[...p.learned,id];save();render();}}
   else if(action==='dialogue-start')start();
   else if(action==='dialogue-answer')answer(b.dataset.value);
   else if(action==='dialogue-next'&&quiz?.answered){quiz.index++;if(quiz.index>=quiz.queue.length)quiz.done=true;else prepare();render();}
   else if(action==='dialogue-exit'){quiz=null;if('speechSynthesis' in window)speechSynthesis.cancel();render();}
   else if(action==='dialogue-retry'){const wrong=quiz?.results.filter(r=>!r.correct).map(r=>r.line)||[];if(wrong.length)start(wrong);}
   return true;
  }
  function change(el){if(el.id==='dialogue-filter'){ui.filter=el.value;render();}else if(el.id==='dialogue-mode')ui.mode=el.value;else if(el.id==='dialogue-reading'){ui.showReading=el.checked;render();}else return false;return true;}
  function keydown(event){if(!quiz||quiz.done||/^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName)||event.ctrlKey||event.altKey||event.metaKey)return;if(/^[1-4]$/.test(event.key)&&!quiz.answered){event.preventDefault();answer(quiz.options[Number(event.key)-1]);}else if(event.key==='Enter'&&quiz.answered){event.preventDefault();handle('dialogue-next',{});}}
  return {render:()=>quiz?quizView():library(),handle,change,keydown,leave:()=>{quiz=null;},stats};
 }
 root.KanaDialogue={create};
})(typeof globalThis!=='undefined'?globalThis:this);
</script>
<script>/* 假名花园 · No dependencies, no account, progress stays in this browser. */
(() => {

    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
    chart:'<path d="M4 3v17h17M8 15v-4m5 4V6m5 9v-7"/>',

  const navItems=[['chart','grid','五十音图'],['cards','cards','记忆卡片'],['quiz','pen','假名测验'],['listen','sound','听音练习'],['dialogue','spark','台词教室'],['review','review','温故知新']];
  const names={chart:'五十音图',cards:'记忆卡片',quiz:'假名测验',listen:'听音练习',dialogue:'动漫台词教室',review:'温故知新',progress:'学习进度',about:'关于与学习提示'};

  const mastered=(script,group)=>D.entries.filter(e=>(!group||e.group===group)&&cardState(e,script)?.streak>=3).length;
  function save(){try{localStorage.setItem(STORE,JSON.stringify(state));storageOK=true;}catch{storageOK=false;toast('浏览器无法保存记录，请到学习进度中导出备份。');}updateShell();}
  function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3600);}
  function view(){const hash=location.hash.slice(1);return names[hash]?hash:'chart';}
  function updateShell(){

    $('#crumb').textContent=names[current];
    const today=state.daily[L.dateKey()]||0;

    $('#goal-message').textContent=today>=20?'今日目标完成，给坚持的自己一朵小花。':'每天 20 次练习，让记忆慢慢开花。';
    $('#streak-days').textContent=L.streakDays(state.daily);
  }
  function intro(label,title,text){return `<div class="view-intro"><div class="eyebrow">${label}</div><h1>${title}</h1><p>${text}</p></div>`;}
  function warning(){return storageOK?'':'<div class="storage-warning">当前浏览器无法正常读取或保存学习记录。练习仍可继续，请在「学习进度」中导出备份。</div>';}
  function summary(){const today=state.daily[L.dateKey()]||0;return `<div class="summary-strip"><div class="summary"><span class="summary-icon">${I('leaf')}</span><div><small>已掌握假名</small><strong>${mastered('hira')+mastered('kata')}<span>/ 208</span></strong></div></div><div class="summary"><span class="summary-icon">${I('sun')}</span><div><small>今日练习</small><strong>${today}<span>次</span></strong></div></div><div class="summary"><span class="summary-icon">${I('check')}</span><div><small>假名正确率</small><strong>${state.answers?Math.round(state.correct/state.answers*100):'—'}<span>${state.answers?'%':'待开始'}</span></strong></div></div><div class="summary"><span class="summary-icon">${I('review')}</span><div><small>错题与标记</small><strong>${wrongCards().length}<span>个待巩固</span></strong></div></div></div>`;}
  function chart(){
    const list=D.entries.filter(e=>e.group===ui.group);let selected=entry(ui.selected);if(!selected||selected.group!==ui.group){selected=list[0];ui.selected=selected.id;}

roup==='voiced'?'「゛」是浊点，「゜」是半浊点。ぢ与じ、づ与ず在现代标准日语中通常同音。':ui.script==='kata'?'片假名常用于外来语、人名和拟声词。先留意「シ / ツ」「ソ / ン」的细小差别。':'先从「あ・い・う・え・お」开始，每天认识一行。熟悉读音后，试着关闭罗马音来回忆。'}</p></div></aside></div><div class="study-note">${I('info')} <span>连续记对 3 次即可标记为掌握。发音使用设备的日语语音；可在「关于与学习提示」查看读音规则。</span></div>`;

  function setup(kind){const content={cards:['FLASHCARDS','记住一音，收获一点。','先在心里读出来，再翻开卡片看看。记忆需要一点点耐心。'],quiz:['A LITTLE CHALLENGE','今天，记住了多少？','把刚认识的假名变成小小的成就。答错的假名会自动加入复习。'],listen:['LISTEN & LEARN','用耳朵，认识日语。','点击播放，听一听这个音，再选出对应的假名。']}[kind];

  function progress(){
    const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return {key:L.dateKey(d),label:`${d.getMonth()+1}/${d.getDate()}`};});
    return intro('YOUR LITTLE ACHIEVEMENTS','看，你已经走了这么远。','每一次练习，都是记忆生长的痕迹。学习记录保存在当前浏览器，可导出备份。')+summary()+`<div class="progress-pair"><section class="panel"><h2>假名掌握情况</h2>${['hira','kata'].map(s=>`<div class="mastery-line"><span>${D.scripts[s]}</span><span>${mastered(s)} / 104</span></div><div class="progress-track"><span style="width:${mastered(s)/104*100}%"></span></div>${Object.keys(D.groups).map(g=>`<div class="mastery-line muted"><span>${D.groups[g]}</span><span>${mastered(s,g)} / ${D.entries.filter(e=>e.group===g).length}</span></div>`).join('')}`).join('')}<p class="muted" style="margin-top:20px">卡片自评「记住了」与测验答对均累计记忆次数；连续记对 3 次标记掌握，记错后重新累计。</p></section><section class="panel"><h2>最近 7 天</h2><p class="muted">包括记忆卡、假名测验与台词小测，每次评价记录 1 次。</p><div class="heatmap">${days.map(d=>`<div class="day-square ${state.daily[d.key]?'done':''}" title="${d.key}: ${state.daily[d.key]||0} 次"><span>${d.label}</span><strong>${state.daily[d.key]||0}</strong></div>`).join('')}</div><div class="result-grid"><div><strong>${L.streakDays(state.daily)}</strong><span>连续学习天数</span></div><div><strong>${state.answers}</strong><span>累计测验题数</span></div></div><p class="muted">假名正确率只统计假名测验与听音题，不包含卡片自评；台词小测在「台词教室」中单独统计。今日目标：20 次练习。</p></section></div><section class="panel data-actions"><h2>照顾好你的学习记录</h2><p class="muted">记录不会自动跨设备同步。清除浏览器数据会移除记录；可以导出 JSON，再在另一台设备导入。</p><div class="button-row"><button class="button secondary" data-action="export">${I('download')}导出备份</button><button class="button secondary" data-action="import">${I('upload')}导入备份</button><button class="button ghost" data-action="reset">清空记录</button></div><p class="muted">离线使用：在线打开一次后，支持的浏览器会缓存页面。语音是否离线可用取决于设备的日语语音包。</p></section>`;
  }
  function about(){return intro('ABOUT THE GARDEN','从五十音，走向更大的世界。','一个简洁、安静的日语假名练习空间。')+`<article class="panel article"><h2>怎么开始？</h2><p>先在五十音图中认识一行假名，再用记忆卡回忆，最后完成 10 题小测验。可以按行筛选练习范围，也可以混合平假名与片假名。答错的假名会自动进入「温故知新」。</p><h2>发音与罗马音</h2><p>本程序包含每种文字的 46 个清音（含拨音 ん）、25 个浊音与半浊音，以及 33 个常用拗音。五十音图是传统名称，并不是 50 个不同的基础假名。较少见的「ぢゃ／ぢゅ／ぢょ」、外来语扩展组合和历史假名未收录。</p><p>默认显示常见的赫本式写法；输入题也接受 shi / si、chi / ti、tsu / tu、fu / hu、ji / zi 等常见替代写法。ぢ另接受 di，づ另接受 du。相同读音的假名不会同时作为反向题或听音题的干扰选项。</p><table><thead><tr><th>假名</th><th>学习提示</th></tr></thead><tbody><tr><td lang="ja">は・へ・を</td><td>作为助词时常读作 wa、e、o；字母识读题使用 ha、he、wo（を也接受 o）。</td></tr><tr><td lang="ja">じ / ぢ、ず / づ</td><td>在现代标准日语中通常同音，本表显示 ji、zu。</td></tr><tr><td lang="ja">きゃ・しゅ・ちょ</td><td>小写的ゃゅょ与前一个假名合读一拍，注意与大写やゆよ区分。</td></tr><tr><td lang="ja">っ / ッ、ー</td><td>小写っ表示促音，ー表示片假名词中的长音；本程序不把它们当作独立音节测试。</td></tr></tbody></table><h2>关于声音</h2><p>发音调用浏览器的 Speech Synthesis（日语语音），不包含录制的真人音频。设备必须有可用的日语语音。语音包缺失时，听音练习会提示安装，其他练习仍可使用。单字语音可能与自然语流中的音变或声调有所不同。</p><h2>GitHub 检索与参考</h2><p>制作前检索了下列公开项目，并参考「自选范围 → 随机测试 → 复习薄弱假名」的学习流程。本程序独立编写，未复制这些项目的源码或素材。</p><table><thead><tr><th>项目</th><th>相关功能</th></tr></thead><tbody><tr><td><a href="https://github.com/furudean/type-kana" target="_blank" rel="noopener noreferrer">Type Kana ↗</a></td><td>平假名、片假名输入测验；仓库提供在线版本链接。</td></tr><tr><td><a href="https://github.com/davidbelesp/kana-practice" target="_blank" rel="noopener noreferrer">Kana Practice ↗</a></td><td>假名图表、自选测验与学习进度。</td></tr><tr><td><a href="https://github.com/skywind3000/KanaQuiz" target="_blank" rel="noopener noreferrer">KanaQuiz ↗</a></td><td>Python 命令行速读测试与历史记录。</td></tr></tbody></table><p>已确认存在相关开源仓库；GitHub Releases 页面未能完整读取，因此不把源码仓库等同于已核验的安装包发布。</p><h2>你的学习记录</h2><p>练习数据使用浏览器 localStorage 保存，不发送给学习数据服务器。导入备份会替换当前记录。访问托管页面时仍适用托管平台自身的访问机制。关闭页面后不会主动发送复习通知。</p><div class="button-row"><button class="button" data-action="view" data-view="chart">回到五十音图 ${I('arrow')}</button><button class="button secondary" data-action="view" data-view="progress">管理学习记录</button></div></article>`;}
  function render(){updateShell();const current=view();$('#main').innerHTML=warning()+(session&&session.origin===current?sessionView():current==='chart'?chart():current==='dialogue'?dialogue.render():['cards','quiz','listen'].includes(current)?setup(current):current==='review'?review():current==='progress'?progress():about());if(session&&!session.done&&!session.answered&&session.mode==='typing')setTimeout(()=>$('#typing-answer')?.focus({preventScroll:true}),0);}
  function navigate(target){if(!names[target])return;session=null;dialogue.leave();if('speechSynthesis' in window)speechSynthesis.cancel();if(location.hash===`#${target}`)render();else location.hash=target;window.scrollTo({top:0,behavior:'instant'});}
  function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`kana-garden-${L.dateKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('学习记录已导出。');}
  document.addEventListener('click',event=>{
    const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
    if(dialogue.handle(a,b))return;
    if(a==='view')navigate(b.dataset.view);
    else if(a==='script'){ui.script=b.dataset.script;render();}
    else if(a==='group'){ui.group=b.dataset.group;render();}
    else if(a==='select-kana'){ui.selected=b.dataset.id;render();}
    else if(a==='next-kana'||a==='prev-kana'){const list=D.entries.filter(e=>e.group===ui.group),i=list.findIndex(e=>e.id===ui.selected);ui.selected=list[(i+(a==='next-kana'?1:-1)+list.length)%list.length].id;render();}
    else if(a==='speak-detail')speak(entry(ui.selected)[ui.script]);
    else if(a==='speak')speak(b.dataset.text);
    else if(a==='speak-current'&&session&&!session.done)speak(session.queue[session.index][session.queue[session.index].script]);
    else if(a==='mark-review'){const k=L.key(entry(ui.selected),ui.script),c=state.cards[k]||{streak:0,wrong:0,review:false,due:0};c.review=!c.review;state.cards[k]=c;save();render();toast(c.review?'已加入复习，可在「温故知新」中练习。':'已取消手动复习标记。');}
    else if(a==='quick-start'){ui.settings.script=ui.script;ui.settings.groups=[ui.group];ui.settings.row='all';navigate('quiz');}
    else if(a==='start-session')startSession(b.dataset.kind);
    else if(a==='answer')answer(b.dataset.value);
    else if(a==='next-question')nextQuestion();
    else if(a==='flip'&&session&&!session.done){session.flipped=!session.flipped;render();}
    else if(a==='rate')rate(b.dataset.success==='true');
    else if(a==='exit-session'){session=null;if('speechSynthesis' in window)speechSynthesis.cancel();render();}
    else if(a==='review-filter'){ui.reviewFilter=b.dataset.filter;render();}
    else if(a==='start-review')startSession('quiz',ui.reviewFilter==='wrong'?wrongCards():dueCards());
    else if(a==='retry-missed'){const kind=session.kind,pool=session.results.filter(r=>!r.success).map(r=>r.card);startSession(kind,pool);}
    else if(a==='restart'){const kind=session.kind,pool=session.pool,count=session.queue.length;startSession(kind,pool,count);}
    else if(a==='export')exportData();
    else if(a==='import'){$('#import-file').value='';$('#import-file').click();}
    else if(a==='reset')$('#confirm-dialog').showModal();
    else if(a==='cancel-reset')$('#confirm-dialog').close();
    else if(a==='confirm-reset'){state=L.fresh();save();$('#confirm-dialog').close();render();toast('学习记录已清空，重新出发。');}
  });
  document.addEventListener('change',async event=>{
    const el=event.target;
    if(dialogue.change(el))return;
    if(el.id==='show-romaji'){ui.showRomaji=el.checked;render();}
    else if(el.name==='setting-group'){ui.settings.groups=[...document.querySelectorAll('input[name="setting-group"]:checked')].map(i=>i.value);ui.settings.row='all';render();}
    else if(el.id.startsWith('setting-')){const name=el.id.slice(8);if(Object.hasOwn(ui.settings,name))ui.settings[name]=el.value;}
    else if(el.id==='import-file'&&el.files[0]){
      const file=el.files[0];if(file.size>2*1024*1024){toast('备份文件过大，请选择本程序导出的 JSON 文件。');return;}
      try{const data=JSON.parse(await file.text());const keys=new Set(allCards().map(e=>L.key(e,e.script)));if(!L.valid(data)||Object.keys(data.cards).some(k=>!keys.has(k))||Object.keys(data.daily).some(k=>!/^\d{4}-\d{2}-\d{2}$/.test(k)))throw new Error('invalid');
        if(!window.confirm('导入备份会替换当前浏览器的学习记录，是否继续？'))return;
        state=data;save();render();toast('备份已导入，可以继续学习了。');
      }catch{toast('无法读取这个备份，请选择假名花园导出的有效 JSON 文件。');}
    }
  });
  document.addEventListener('submit',event=>{if(event.target.id==='typing-form'){event.preventDefault();answer($('#typing-answer').value);}});
  document.addEventListener('keydown',event=>{
    if(view()==='dialogue'){dialogue.keydown(event);return;}
    if(!session||session.done||event.ctrlKey||event.altKey||event.metaKey||$('#confirm-dialog').open)return;
    if(/^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName))return;
    if(event.key==='Enter'&&session.answered){event.preventDefault();nextQuestion();}
    else if(session.kind==='cards'&&event.code==='Space'){event.preventDefault();session.flipped=!session.flipped;render();}
    else if(session.kind==='cards'&&session.flipped&&['1','2'].includes(event.key)){event.preventDefault();rate(event.key==='2');}
    else if(session.kind!=='cards'&&session.mode!=='typing'&&!session.answered&&/^[1-4]$/.test(event.key)){event.preventDefault();const option=session.options[Number(event.key)-1];if(option)answer(option);}
  });
  window.addEventListener('hashchange',()=>{session=null;dialogue.leave();render();});
  if('speechSynthesis' in window)speechSynthesis.addEventListener('voiceschanged',()=>{const status=$('#voice-status');if(status)status.textContent=hasJapaneseVoice()?'已检测到日语语音，准备好就开始吧。':'未检测到日语语音。请安装系统日语语音包后刷新；其他练习仍可使用。';});
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
  render();
})();
</script>
</body></html>
